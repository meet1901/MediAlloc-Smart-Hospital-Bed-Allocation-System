<!DOCTYPE html>
<html>

<head>
    <title>Smart Hospital Bed Allocation System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">MediAlloc - Bed Allocation System</a>
            <div>
                <a href="/" class="btn btn-light btn-sm me-2">Dashboard</a>
                <a href="/add_patient" class="btn btn-light btn-sm me-2">Add Patient</a>
                <a href="/patients" class="btn btn-light btn-sm me-2">Patients</a>
                <a href="/waiting_list" class="btn btn-light btn-sm me-2">Waiting List</a>
                <a href="/beds" class="btn btn-light btn-sm">Beds</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
